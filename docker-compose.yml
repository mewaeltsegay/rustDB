version: "3.8"

services:
  # Primary server with 4 shards
  primary:
    build: .
    container_name: rustdb_primary
    command: ["--server", "--port", "8000", "--shards", "4", "--replicas", "http://replica1:8001,http://replica2:8002"]
    ports:
      - "8000:8000"
    environment:
      - RUST_LOG=debug
    networks:
      - rustdb_net
    restart: unless-stopped

  # First replica (will also run 4 shards)
  replica1:
    build: .
    container_name: rustdb_replica1
    command: ["--server", "--replica", "--primary-url", "http://primary:8000", "--port", "8001", "--shards", "4"]
    ports:
      - "8001:8001"
    environment:
      - RUST_LOG=debug
    depends_on:
      - primary
    networks:
      - rustdb_net
    restart: unless-stopped

  # Second replica (will also run 4 shards)
  replica2:
    build: .
    container_name: rustdb_replica2
    command: ["--server", "--replica", "--primary-url", "http://primary:8000", "--port", "8002", "--shards", "4"]
    ports:
      - "8002:8002"
    environment:
      - RUST_LOG=debug
    depends_on:
      - primary
    networks:
      - rustdb_net
    restart: unless-stopped

  # Client for testing
  client:
    build: .
    container_name: rustdb_client
    command: ["--client"]
    environment:
      - RUST_LOG=debug
    depends_on:
      - primary
      - replica1
      - replica2
    networks:
      - rustdb_net
    restart: "no"

# Explicit network for better isolation and DNS
networks:
  rustdb_net:
    name: rustdb_network
    driver: bridge
